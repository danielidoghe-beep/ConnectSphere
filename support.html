<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Support - VerifyStackAcct</title>

    <link rel="stylesheet" href="support.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="top-header">

        <button
            type="button"
            class="icon-button menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="header-right">

            <button
                type="button"
                class="icon-button moon-button"
                id="themeButton"
                aria-label="Toggle dark mode"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M20.5 14.7A8.5 8.5 0 0 1 9.3 3.5
                           8.5 8.5 0 1 0 20.5 14.7Z"
                    />
                </svg>
            </button>

            <button
                type="button"
                class="notification-button"
                id="notificationButton"
                aria-label="Notifications"
            >
                <span
                    class="notification-count"
                    id="notificationCount"
                >0</span>

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    />
                    <path d="M10 21h4" />
                </svg>
            </button>

            <button
                type="button"
                class="profile-button"
                id="profileButton"
                aria-label="Profile"
            >
                <span id="profileInitial">D</span>
            </button>

        </div>

    </header>


    <!-- =========================
         SIDE MENU
    ========================== -->
    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >

        <div class="side-menu-header">
            <strong>VerifyStackAcct</strong>

            <button
                type="button"
                id="closeMenuButton"
                class="close-menu-button"
                aria-label="Close menu"
            >
                ×
            </button>
        </div>

        <nav class="side-navigation">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="wallet.html">
                Wallet
            </a>

            <a href="support.html" class="active">
                Support
            </a>

            <a href="orders.html">
                Orders
            </a>

        </nav>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="support-page">

        <section class="page-heading">

            <h1>Support</h1>

            <p>
                Get help with your orders and your account.
            </p>

        </section>


        <!-- =========================
             SUPPORT TITLE
        ========================== -->
        <section class="support-title-row">

            <div class="support-title-text">

                <h2>Support tickets</h2>

                <p>
                    Submit and manage your requests from a single place.
                </p>

            </div>

            <button
                type="button"
                class="new-ticket-button"
                id="newTicketButton"
            >
                <span>+ NEW</span>
                <span>TICKET</span>
            </button>

        </section>


        <!-- =========================
             TICKETS
        ========================== -->
        <section class="tickets-container">

            <!-- Empty state -->
            <div
                class="empty-ticket-state"
                id="emptyTicketState"
            >

                <div class="empty-icon">

                    <svg
                        viewBox="0 0 64 64"
                        aria-hidden="true"
                    >
                        <path d="M18 15h28a5 5 0 0 1 5 5v22a5 5 0 0 1-5 5H30l-12 9V20a5 5 0 0 1 5-5Z" />
                        <path d="M26 27h16" />
                        <path d="M26 35h11" />
                    </svg>

                </div>

                <h3>No tickets yet</h3>

                <p>
                    Open a ticket if you need help
                    with an order or your account
                </p>

                <button
                    type="button"
                    class="open-first-ticket-button"
                    id="openFirstTicketButton"
                >
                    OPEN FIRST TICKET
                </button>

            </div>


            <!-- Ticket list -->
            <div
                class="ticket-list"
                id="ticketList"
            ></div>

        </section>

    </main>


    <!-- =========================
         SUPPORT TICKET MODAL
    ========================== -->
    <div
        class="modal-backdrop"
        id="ticketModal"
        aria-hidden="true"
    >

        <div
            class="ticket-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="ticketModalTitle"
        >

            <div class="modal-header">

                <h2 id="ticketModalTitle">
                    Open a support ticket
                </h2>

                <button
                    type="button"
                    class="modal-close"
                    id="closeTicketModal"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>


            <form id="ticketForm">

                <div class="form-group">

                    <label for="ticketSubject">
                        Subject
                    </label>

                    <input
                        type="text"
                        id="ticketSubject"
                        name="subject"
                        placeholder="What do you need help with?"
                        autocomplete="off"
                        maxlength="120"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="ticketMessage">
                        Message
                    </label>

                    <textarea
                        id="ticketMessage"
                        name="message"
                        placeholder="Describe your issue in detail. Include your order ID if relevant."
                        maxlength="2000"
                        required
                    ></textarea>

                </div>


                <div
                    class="form-error"
                    id="ticketFormError"
                ></div>


                <div class="modal-actions">

                    <button
                        type="button"
                        class="cancel-button"
                        id="cancelTicketButton"
                    >
                        CANCEL
                    </button>

                    <button
                        type="submit"
                        class="submit-ticket-button"
                        id="submitTicketButton"
                    >
                        <span id="submitButtonText">
                            SUBMIT<br>TICKET
                        </span>

                        <span
                            class="button-loader"
                            id="submitLoader"
                        ></span>
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script type="module" src="support.js"></script>

</body>
</html>
