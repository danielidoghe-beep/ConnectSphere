<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Tools Store</title>

    <link rel="stylesheet" href="tools.css">

    <script
        type="module"
        src="tools.js"
        defer
    ></script>
</head>

<body>

<header class="topbar">

    <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
    >
        <span></span>
        <span></span>
        <span></span>
    </button>


    <div class="balance-pill">
        <span id="balanceAmount">₦0</span>
    </div>


    <button
        class="theme-button"
        id="themeButton"
        aria-label="Toggle theme"
    >
        ☾
    </button>


    <button
        class="notification-button"
        id="notificationButton"
        aria-label="Notifications"
    >
        <span class="notification-icon"></span>

        <span
            class="notification-count"
            id="notificationCount"
        >
            0
        </span>
    </button>


    <button
        class="profile-button"
        id="profileButton"
        aria-label="Profile"
    >
        <span id="headerInitial">?</span>
    </button>

</header>


<main class="tools-page">

    <section class="tools-heading">

        <h1>Tools Store</h1>

        <p>
            Updates, picture sets, and more
            <span id="totalToolsText">0 tools available</span>
        </p>

    </section>


    <section class="tools-controls">

        <div class="search-box">

            <span class="search-icon"></span>

            <input
                type="search"
                id="toolSearch"
                placeholder="Search tools..."
                autocomplete="off"
            >

        </div>


        <div
            class="category-tabs"
            id="categoryTabs"
        ></div>

    </section>


    <section
        class="tools-container"
        id="toolsContainer"
    >

        <div class="loading-state">
            Loading tools...
        </div>

    </section>

</main>


<!-- TOOL DETAILS MODAL -->

<div
    class="modal-overlay"
    id="toolModal"
>

    <div
        class="tool-modal"
        role="dialog"
        aria-modal="true"
    >

        <button
            class="modal-close"
            id="modalClose"
            aria-label="Close"
        >
            ×
        </button>


        <div
            class="modal-images"
            id="modalImages"
        ></div>


        <div class="modal-content">

            <h2 id="modalToolName">
                Tool
            </h2>


            <div
                class="modal-category"
                id="modalToolCategory"
            ></div>


            <p
                class="modal-description"
                id="modalToolDescription"
            ></p>


            <div class="modal-price-row">

                <span>Price</span>

                <strong id="modalToolPrice">
                    ₦0
                </strong>

            </div>


            <button
                class="buy-button"
                id="buyToolButton"
            >
                Buy
            </button>

        </div>

    </div>

</div>


<!-- SIDE MENU -->

<div
    class="menu-overlay"
    id="menuOverlay"
></div>


<aside
    class="side-menu"
    id="sideMenu"
>

    <button
        class="menu-close"
        id="menuClose"
        aria-label="Close menu"
    >
        ×
    </button>


    <nav>

        <a href="index.html">Home</a>

        <a href="store.html">Logs Store</a>

        <a href="tools.html">Tools Store</a>

        <a href="wallet.html">Wallet</a>

        <a href="orders.html">Orders</a>

        <a href="support.html">Support</a>

        <a href="profile.html">Profile</a>

    </nav>

</aside>


<!-- NOTICE -->

<div
    class="notice-overlay"
    id="noticeOverlay"
>

    <div class="notice-modal">

        <button
            class="modal-close"
            id="noticeClose"
            aria-label="Close"
        >
            ×
        </button>


        <h2 id="noticeTitle">
            Important notice
        </h2>


        <div class="notice-box">

            <strong>Important</strong>

            <p id="noticeText">
                Please make sure you understand the
                product before purchasing it.
            </p>

        </div>


        <div class="notice-price">

            <span>Amount</span>

            <strong id="noticePrice">
                ₦0
            </strong>

        </div>


        <button
            class="buy-button"
            id="confirmBuyButton"
        >
            Buy now
        </button>

    </div>

</div>

</body>
</html>
