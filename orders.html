<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Orders</title>

    <link rel="stylesheet" href="orders.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="top-header">

        <button
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="header-right">

            <div class="balance-pill" id="balancePill">
                <span id="headerBalance">₦0</span>
            </div>

            <button
                class="moon-button"
                id="themeButton"
                aria-label="Toggle dark mode"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M21 15.2A8.5 8.5 0 0 1 8.8 3a8.5 8.5 0 1 0 12.2 12.2Z"></path>
                </svg>
            </button>

            <button
                class="notification-button"
                aria-label="Notifications"
            >
                <svg viewBox="0 0 24 24">
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>

                <span
                    class="notification-count"
                    id="notificationCount"
                >0</span>
            </button>

            <button
                class="profile-button"
                id="profileButton"
                aria-label="Profile"
            >
                <span id="profileLetter">D</span>
            </button>

        </div>

    </header>


    <!-- =========================
         SIDE MENU
    ========================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="side-menu-header">

            <strong>Menu</strong>

            <button
                class="close-menu-button"
                id="closeMenuButton"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>

        <nav class="side-navigation">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="orders.html" class="active">
                Orders
            </a>

            <a href="wallet.html">
                Wallet
            </a>

            <a href="support.html">
                Support
            </a>

        </nav>

    </aside>


    <!-- =========================
         PAGE
    ========================== -->

    <main class="orders-page">

        <section class="page-heading">

            <h1>Orders</h1>

            <p>Your purchase history</p>

        </section>


        <!-- =========================
             RECENT ORDERS
        ========================== -->

        <section class="orders-container">

            <div class="orders-header">

                <h2>RECENT ORDERS</h2>

                <button
                    class="refresh-button"
                    id="refreshOrdersButton"
                    aria-label="Refresh orders"
                >
                    ↻
                </button>

            </div>


            <!-- Loading -->
            <div
                class="orders-loading"
                id="ordersLoading"
            >
                <div class="loading-spinner"></div>

                <p>Loading your orders...</p>
            </div>


            <!-- Empty -->
            <div
                class="empty-orders"
                id="emptyOrders"
                hidden
            >

                <h3>No orders yet</h3>

                <p>
                    You have not made any purchases yet.
                </p>

            </div>


            <!-- Orders -->
            <div
                class="orders-list"
                id="ordersList"
            ></div>


            <!-- Firebase/auth problem -->
            <div
                class="orders-message"
                id="ordersMessage"
                hidden
            >
                <p id="ordersMessageText"></p>

                <button
                    id="retryOrdersButton"
                >
                    TRY AGAIN
                </button>
            </div>

        </section>

    </main>


    <!-- =========================
         FIREBASE
    ========================== -->

    <script type="module" src="orders.js"></script>

</body>
</html>
