<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
  <meta charset="UTF-8" />
  <!-- Disable iOS auto-zoom on inputs -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#5b9c3e" />
  <title>Orders</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared shell first, then order-specific styles -->
  <link rel="stylesheet" href="wallet.css" />
  <link rel="stylesheet" href="orders.css" />
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header class="topbar">
    <button class="icon-btn" aria-label="Open menu" id="menuBtn">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="topbar-right">
      <span class="currency-pill">₦ NGN</span>

      <button class="icon-btn" aria-label="Toggle dark mode" id="themeBtn">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>

      <!-- Avatar initial comes from Firebase user -->
      <span class="avatar" id="userAvatar">D</span>
    </div>
  </header>

  <main class="page">
    <!-- ============ PAGE TITLE ============ -->
    <section class="page-head">
      <h1 class="page-title">Orders</h1>
      <p class="page-sub">Your purchase history</p>
    </section>

    <!-- ============ RECENT ORDERS ============ -->
    <section class="card">
      <div class="orders-head">
        <h2 class="card-title">RECENT ORDERS</h2>
      </div>

      <!-- Orders are injected here from Firebase -->
      <div id="orderList" class="order-list">
        <!-- Empty state (shown until Firebase returns orders) -->
        <div class="empty-order" id="orderEmpty">
          <p class="empty-title">No orders yet</p>
          <p class="empty-sub">You have not made any purchases yet.</p>
        </div>
      </div>
    </section>
  </main>

  <!-- ============ COPY TOAST ============ -->
  <div class="toast" id="copyToast" role="alert" aria-live="polite" style="background: var(--green); box-shadow: 0 8px 24px rgba(91,156,62,0.4);">
    Copied
  </div>

  <!-- Firebase + app logic -->
  <script type="module" src="orders.js"></script>
</body>
</html>
