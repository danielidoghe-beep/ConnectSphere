<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Orders</title>

    <link rel="stylesheet" href="orders.css">

    <!-- Firebase -->
    <script type="module" src="orders.js"></script>
</head>

<body>

    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="top-header">

        <!-- Hamburger -->
        <button
            class="menu-button"
            id="menuButton"
            type="button"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <!-- Header right -->
        <div class="header-right">

            <!-- Wallet -->
            <div class="wallet-balance">
                <span id="walletBalance">₦0</span>
            </div>


            <!-- Dark mode -->
            <button
                class="moon-button"
                id="darkModeButton"
                type="button"
                aria-label="Toggle dark mode"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M20.5 14.8A8.5 8.5 0 0 1 9.2 3.5
                           A8.5 8.5 0 1 0 20.5 14.8Z"
                    ></path>
                </svg>
            </button>


            <!-- Notifications -->
            <button
                class="notification-button"
                type="button"
                aria-label="Notifications"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M18 9a6 6 0 0 0-12 0
                           c0 7-3 7-3 9h18c0-2-3-2-3-9"
                    ></path>

                    <path d="M10 21h4"></path>
                </svg>

                <span class="notification-count">99+</span>
            </button>


            <!-- Profile -->
            <button
                class="profile-button"
                id="profileButton"
                type="button"
                aria-label="Profile"
            >
                <span id="profileInitial">D</span>
            </button>

        </div>

    </header>


    <!-- =========================================
         SIDE MENU
    ========================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>

    <aside
        class="side-menu"
        id="sideMenu"
        aria-hidden="true"
    >

        <div class="side-menu-header">

            <strong>MENU</strong>

            <button
                class="close-menu-button"
                id="closeMenuButton"
                type="button"
                aria-label="Close menu"
            >
                ×
            </button>

        </div>

        <nav class="side-navigation">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="orders.html" class="active">
                Orders
            </a>

            <a href="wallet.html">
                Wallet
            </a>

            <a href="support.html">
                Support
            </a>

        </nav>

    </aside>


    <!-- =========================================
         MAIN PAGE
    ========================================== -->

    <main class="orders-page">

        <!-- Page heading -->
        <section class="page-heading">

            <h1>Orders</h1>

            <p>Your purchase history</p>

        </section>


        <!-- =====================================
             RECENT ORDERS
        ====================================== -->

        <section class="orders-container">

    <div class="orders-header">
        <h2>RECENT ORDERS</h2>
    </div>

    <!-- Firebase orders are inserted here -->
    <div id="ordersList" class="orders-list"></div>

    <!-- Shown ONLY when Firebase returns zero orders -->
    <div id="emptyOrders" class="empty-orders">
        <h3>No orders yet</h3>
        <p>You have not made any purchases yet.</p>
    </div>

</section>

    </main>


    <!-- =========================================
         ORDER DETAILS MODAL
    ========================================== -->

    <div
        class="order-modal-backdrop"
        id="orderModalBackdrop"
        aria-hidden="true"
    >

        <div
            class="order-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="orderModalTitle"
        >

            <div class="order-modal-header">

                <h2 id="orderModalTitle">
                    Order details
                </h2>

                <button
                    id="closeOrderModal"
                    class="order-modal-close"
                    type="button"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

            <div
                class="order-modal-content"
                id="orderModalContent"
            ></div>

        </div>

    </div>

</body>
</html>
