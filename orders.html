<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Orders</title>

    <link rel="stylesheet" href="orders.css">
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">

        <!-- Menu -->
        <button
            type="button"
            class="menu-button"
            id="menuButton"
            aria-label="Open menu"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <!-- Header right -->
        <div class="header-right">

            <!-- Wallet balance -->
            <div class="wallet-balance" id="walletBalance">
                <span id="balanceValue">₦0</span>
            </div>


            <!-- Dark mode -->
            <button
                type="button"
                class="moon-button"
                id="themeButton"
                aria-label="Toggle dark mode"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M20.5 15.5A8.5 8.5 0 0 1 8.5 3.5
                           A8.6 8.6 0 1 0 20.5 15.5Z"
                    />
                </svg>
            </button>


            <!-- Notifications -->
            <button
                type="button"
                class="notification-button"
                id="notificationButton"
                aria-label="Notifications"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
                    <path d="M10 21h4"></path>
                </svg>

                <span
                    class="notification-count"
                    id="notificationCount"
                >0</span>
            </button>


            <!-- Profile -->
            <button
                type="button"
                class="profile-button"
                id="profileButton"
                aria-label="Profile"
            >
                <span id="profileInitial">?</span>
            </button>

        </div>

    </header>



    <!-- SIDE MENU -->
    <div
        class="menu-overlay"
        id="menuOverlay"
    ></div>

    <aside
        class="side-menu"
        id="sideMenu"
    >

        <div class="side-menu-header">

            <strong id="menuUserName">
                Account
            </strong>

            <button
                type="button"
                class="close-menu-button"
                id="closeMenuButton"
            >
                ×
            </button>

        </div>


        <nav class="side-navigation">

            <a href="#">
                Home
            </a>

            <a href="#">
                Wallet
            </a>

            <a
                href="#"
                class="active"
            >
                Orders
            </a>

            <a href="#">
                Support
            </a>

            <a href="#">
                Profile
            </a>

        </nav>

    </aside>



    <!-- PAGE -->
    <main class="orders-page">

        <!-- PAGE HEADING -->
        <section class="page-heading">

            <h1>
                Orders
            </h1>

            <p>
                Your purchase history
            </p>

        </section>



        <!-- RECENT ORDERS -->
        <section class="orders-container">

            <h2>
                RECENT ORDERS
            </h2>


            <!-- Orders generated here by Firebase -->
            <div
                class="orders-list"
                id="ordersList"
            ></div>


            <!-- Empty state -->
            <div
                class="empty-orders"
                id="emptyOrders"
                hidden
            >

                <h3>
                    No orders yet
                </h3>

                <p>
                    You have not made any purchases yet.
                </p>

            </div>


            <!-- Loading -->
            <div
                class="orders-loading"
                id="ordersLoading"
            >
                Loading your orders...
            </div>


            <!-- Error -->
            <div
                class="orders-error"
                id="ordersError"
                hidden
            >

                <h3>
                    Unable to load orders
                </h3>

                <p id="ordersErrorMessage">
                    Please try again.
                </p>

                <button
                    type="button"
                    id="retryOrdersButton"
                >
                    TRY AGAIN
                </button>

            </div>

        </section>

    </main>



    <!-- Firebase -->
    <script type="module" src="orders.js"></script>

</body>
</html>
