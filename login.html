<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in | Connectsphere</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="login-header">

        <a href="index.html" class="brand" aria-label="VerifyStackAcct Home">

            <!-- Connectsphere Logo -->
            <svg
                class="brand-logo"
                viewBox="0 0 48 48"
                aria-hidden="true"
            >
                <path
                    d="M24 5L5 15L24 25L43 15L24 5Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linejoin="round"
                />

                <path
                    d="M5 24L24 34L43 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linejoin="round"
                />

                <path
                    d="M5 33L24 43L43 33"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="3"
                    stroke-linejoin="round"
                />
            </svg>

            <span class="brand-name">Connectsphere</span>

        </a>


        <div class="header-actions">

            <!-- Theme Button -->
            <button
                type="button"
                class="theme-button"
                id="themeToggle"
                aria-label="Toggle dark mode"
            >
                <svg
                    class="moon-icon"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M21 12.8A8.5 8.5 0 0 1 11.2 3
                           A8.5 8.5 0 1 0 21 12.8Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </button>


            <!-- Menu Button -->
            <button
                type="button"
                class="menu-button"
                id="menuToggle"
                aria-label="Open menu"
                aria-expanded="false"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <!-- =========================
         LOGIN PAGE
    ========================== -->
    <main class="login-page">

        <section class="login-container">

            <!-- Heading -->
            <div class="login-heading">

                <h1>Sign in</h1>

                <p>
                    Welcome back to Connectsphere
                </p>

            </div>


            <!-- =========================
                 GOOGLE SIGN IN
            ========================== -->
            <button
                type="button"
                class="google-login-button"
                id="googleSignIn"
            >

                <!-- Real Google G logo -->
                <svg
                    class="google-icon"
                    viewBox="0 0 48 48"
                    aria-hidden="true"
                >
                    <path
                        fill="#EA4335"
                        d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6
                           l6.85-6.85C35.9 2.54 30.47 0 24 0
                           14.62 0 6.51 5.38 2.56 13.22l7.98 6.2
                           C12.45 13.18 17.74 9.5 24 9.5Z"
                    />

                    <path
                        fill="#4285F4"
                        d="M46.5 24.5c0-1.64-.15-3.21-.44-4.73H24v9h12.63
                           c-.54 2.9-2.18 5.35-4.64 7l7.48 5.8
                           C43.82 37.53 46.5 31.5 46.5 24.5Z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M10.54 28.58A14.46 14.46 0 0 1 9.5 24
                           c0-1.59.37-3.12 1.04-4.58l-7.98-6.2
                           A23.96 23.96 0 0 0 0 24c0 3.87.92 7.53
                           2.56 10.78l7.98-6.2Z"
                    />

                    <path
                        fill="#34A853"
                        d="M24 48c6.47 0 11.9-2.13 15.87-5.8l-7.48-5.8
                           c-2.08 1.4-4.74 2.23-8.39 2.23
                           -6.26 0-11.55-3.68-13.46-8.92l-7.98 6.2
                           C6.51 42.62 14.62 48 24 48Z"
                    />
                </svg>

                <span>Sign in with Google</span>

            </button>


            <!-- =========================
                 DIVIDER
            ========================== -->
            <div class="login-divider">

                <span class="divider-line"></span>

                <span class="divider-text">
                    or sign in with email
                </span>

                <span class="divider-line"></span>

            </div>


            <!-- =========================
                 LOGIN FORM
            ========================== -->
            <form
                class="login-form"
                id="loginForm"
                novalidate
            >

                <!-- Firebase Message -->
                <div
                    class="firebase-message"
                    id="firebaseMessage"
                    role="alert"
                    aria-live="polite"
                    hidden
                >
                    <span id="firebaseMessageText"></span>
                </div>


                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                    >

                </div>


                <!-- Password -->
                <div class="form-group password-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >

                        <!-- Password visibility button -->
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >

                            <!-- Eye icon -->
                            <svg
                                class="eye-icon eye-open"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.5-6 10-6
                                       10 6 10 6-3.5 6-10 6
                                       S2 12 2 12Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                            </svg>


                            <!-- Eye-off icon -->
                            <svg
                                class="eye-icon eye-closed"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M3 3l18 18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 6.2A10.7 10.7 0 0 1 12 6
                                       c6.5 0 10 6 10 6
                                       a17.6 17.6 0 0 1-3.1 3.5"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M6.1 8.1C3.7 9.7 2 12 2 12
                                       s3.5 6 10 6
                                       c1.4 0 2.7-.3 3.8-.8"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="login-options">

                    <label class="remember-me">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span class="remember-text">
                            Remember me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- Sign In Button -->
                <button
                    type="submit"
                    class="signin-button"
                    id="signInButton"
                >
                    <span id="signInButtonText">Sign in</span>
                </button>

            </form>


            <!-- Sign Up -->
            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->
    <script type="module" src="login.js"></script>

</body>
</html>
