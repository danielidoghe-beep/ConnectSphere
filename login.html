<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Sign In — Connecsphere</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <a href="index.html" class="brand">

            <!-- Connectsphere logo -->
            <svg
                class="brand-logo"
                viewBox="0 0 48 48"
                aria-hidden="true"
            >
                <path
                    d="M24 4L44 14L24 24L4 14L24 4Z"
                    fill="none"
                    stroke="#5ca91c"
                    stroke-width="4"
                    stroke-linejoin="round"
                />

                <path
                    d="M4 24L24 34L44 24"
                    fill="none"
                    stroke="#5ca91c"
                    stroke-width="4"
                    stroke-linejoin="round"
                />

                <path
                    d="M4 34L24 44L44 34"
                    fill="none"
                    stroke="#5ca91c"
                    stroke-width="4"
                    stroke-linejoin="round"
                />
            </svg>

            <span>Connectsphere</span>

        </a>


        <div class="header-actions">

            <!-- Dark mode -->
            <button
                type="button"
                class="theme-btn"
                id="themeBtn"
                aria-label="Toggle dark mode"
            >
                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path
                        d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5
                        A8.5 8.5 0 1 0 20.5 14.5Z"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                    />
                </svg>
            </button>


            <!-- Menu -->
            <button
                type="button"
                class="menu-btn"
                id="menuBtn"
                aria-label="Open menu"
            >
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>

    </header>


    <!-- =========================
         SIGN IN
    ========================== -->

    <main class="signin-page">

        <section class="signin-container">

            <!-- Heading -->

            <div class="signin-heading">

                <h1>Sign in</h1>

                <p>
                    Welcome back to VerifyStackAcct
                </p>

            </div>


            <!-- =========================
                 GOOGLE SIGN IN
            ========================== -->

            <button
                type="button"
                class="google-btn"
                id="googleSignInBtn"
            >

                <span class="google-icon" aria-hidden="true">

                    <svg
                        viewBox="0 0 48 48"
                        role="img"
                    >
                        <path
                            fill="#FFC107"
                            d="M43.6 20.5H42V20H24v8h11.3
                            c-1.6 4.7-6.1 8-11.3 8
                            -6.6 0-12-5.4-12-12
                            s5.4-12 12-12
                            c3.1 0 5.9 1.2 8 3.1
                            l5.7-5.7
                            C34.1 6.1 29.3 4 24 4
                            12.9 4 4 12.9 4 24
                            s8.9 20 20 20
                            20-8.9 20-20
                            c0-1.3-.1-2.4-.4-3.5Z"
                        />

                        <path
                            fill="#FF3D00"
                            d="M6.3 14.7l6.6 4.8
                            C14.7 16.1 19 13 24 13
                            c3.1 0 5.9 1.2 8 3.1
                            l5.7-5.7
                            C34.1 6.1 29.3 4 24 4
                            c-7.7 0-14.3 4.3-17.7 10.7Z"
                        />

                        <path
                            fill="#4CAF50"
                            d="M24 44c5.2 0 10-2 13.5-5.2
                            l-6.2-5.2
                            c-2 1.5-4.5 2.4-7.3 2.4
                            -5.2 0-9.6-3.3-11.3-8
                            l-6.6 5.1
                            C9.5 39.7 16.2 44 24 44Z"
                        />

                        <path
                            fill="#1976D2"
                            d="M43.6 20.5H42V20H24v8h11.3
                            c-.8 2.4-2.2 4.5-4 6
                            l6.2 5.2
                            C41.1 35.6 44 30.4 44 24
                            c0-1.3-.1-2.4-.4-3.5Z"
                        />

                    </svg>

                </span>

                <span>
                    Sign in with Google
                </span>

            </button>


            <!-- =========================
                 DIVIDER
            ========================== -->

            <div class="signin-divider">

                <span></span>

                <p>or sign in with email</p>

                <span></span>

            </div>


            <!-- =========================
                 FIREBASE MESSAGE
            ========================== -->

            <div
                class="auth-message auth-error"
                id="authError"
                role="alert"
                aria-live="polite"
                hidden
            >
                <span id="authErrorText">
                    Invalid email or password
                </span>
            </div>


            <div
                class="auth-message auth-success"
                id="authSuccess"
                role="status"
                aria-live="polite"
                hidden
            >
                <span id="authSuccessText">
                    Login successful! Redirecting…
                </span>
            </div>


            <!-- =========================
                 EMAIL LOGIN FORM
            ========================== -->

            <form
                class="signin-form"
                id="signinForm"
                novalidate
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >

                            <!-- Eye icon -->
                            <svg
                                class="eye-open"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2 12s3.5-6 10-6
                                    10 6 10 6
                                    -3.5 6-10 6
                                    -10-6-10-6Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                />
                            </svg>


                            <!-- Eye slash icon -->
                            <svg
                                class="eye-closed"
                                viewBox="0 0 24 24"
                                aria-hidden="true"
                            >
                                <path
                                    d="M3 3l18 18"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M10.6 6.2
                                    A10.8 10.8 0 0 1 12 6
                                    c6.5 0 10 6 10 6
                                    a17.4 17.4 0 0 1-3.1 3.5
                                    M6.2 6.8
                                    C3.6 8.6 2 12 2 12
                                    s3.5 6 10 6
                                    c1.4 0 2.7-.3 3.8-.8"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                />
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->

                <div class="form-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span>
                            Remember me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-link"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- Submit -->

                <button
                    type="submit"
                    class="signin-btn"
                    id="signinBtn"
                >
                    <span id="signinBtnText">
                        Sign in
                    </span>

                    <span
                        id="signinSpinner"
                        class="signin-spinner"
                        aria-hidden="true"
                        hidden
                    ></span>
                </button>

            </form>


            <!-- =========================
                 SIGN UP
            ========================== -->

            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         FIREBASE
    ========================== -->

        import {

        const firebaseConfig = {

            apiKey:
                "AIzaSyAKAD0Gxtk4XxMmnR_kpjmy5VLoX72Dtls",

            authDomain:
                "connectsphere-7a679.firebaseapp.com",

            projectId:
                "connectsphere-7a679",

            storageBucket:
                "connectsphere-7a679.firebasestorage.app",

            messagingSenderId:
                "748741698521",

            appId:
                "1:748741698521:web:ea08d28f31a4d8638c2fc8",

            measurementId:
                "G-WRQ5GX3KMZ"
        };


        const app = initializeApp(firebaseConfig);

        getAnalytics(app);

    </script>


    <!-- Main site JavaScript -->
    <script src="script.js"></script>

</body>
</html>
