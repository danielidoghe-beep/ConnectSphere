<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Sign in · Connecsphere</title>
    <meta name="description" content="Sign in to your VerifyStackAcct account." />
    <meta name="theme-color" content="#6cad3f" />

    <!-- Fonts: Archivo (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./login.css" />
    <script src="./ui.js"></script>
  </head>
  <body>
    <!-- Header -->
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="VerifyStackAcct home">
        <svg class="brand-logo" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
          <path d="M12 2 2 7l10 5 10-5-10-5Z" fill="currentColor" />
          <path d="M2 12l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M2 17l10 5 10-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span class="brand-name">Connectsphere</span>
      </a>

      <div class="header-actions">
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle dark mode">
          <!-- moon -->
          <svg class="icon-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <!-- sun -->
          <svg class="icon-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>

        <button id="menuToggle" class="icon-btn" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path d="M3 6h18M3 12h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Main -->
    <main class="auth">
      <div class="auth-inner">
        <h1 class="auth-title">Sign in</h1>
        <p class="auth-subtitle">Welcome back to Connectsphere</p>

        <!-- Google -->
        <button id="googleBtn" class="btn-google" type="button">
          <svg class="google-icon" viewBox="0 0 48 48" width="22" height="22" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5Z" />
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65Z" />
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19Z" />
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48Z" />
          </svg>
          <span id="googleBtnText">Sign in with Google</span>
        </button>

        <div class="divider"><span>or sign in with email</span></div>

        <!-- Message box (error / success) -->
        <div id="message" class="message" role="alert" aria-live="polite" hidden></div>

        <!-- Form -->
        <form id="authForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
              <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                <svg class="icon-eye" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                  <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2" />
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </button>
            </div>
          </div>

          <div class="form-row">
            <label class="checkbox">
              <input type="checkbox" id="remember" name="remember" />
              <span class="checkbox-box" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="14" height="14"><path d="M20 6 9 17l-5-5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </span>
              <span>Remember me</span>
            </label>
            <button type="button" id="forgotBtn" class="link">Forgot password?</button>
          </div>

          <button type="submit" id="submitBtn" class="btn-primary">Sign in</button>
        </form>

        <p class="auth-footer">
          <span id="footerText">Don't have an account?</span>
          <button type="button" id="toggleMode" class="link link-strong">Sign up</button>
        </p>
      </div>
    </main>

    <!-- Firebase auth logic (module) -->
    <script type="module" src="./auth.js"></script>
  </body>
</html>
