<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign in - Connectsphere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #0b0b0b;
      -webkit-font-smoothing: antialiased;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      height: 132px;
      width: 100%;
      border-bottom: 1px solid #dddddd;
      display: flex;
      align-items: center;
      padding: 0 40px;
    }

    .header-inner {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: #080808;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      margin-right: 14px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 32px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.4px;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 54px;
    }

    /* Moon */

    .theme-button {
      width: 38px;
      height: 38px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .moon-icon {
      width: 34px;
      height: 34px;
      border: 4px solid #5f5f5f;
      border-radius: 50%;
      position: relative;
      transform: rotate(-25deg);
    }

    .moon-icon::after {
      content: "";
      position: absolute;
      width: 29px;
      height: 29px;
      background: #ffffff;
      border-radius: 50%;
      top: -8px;
      right: -8px;
    }

    /* Hamburger */

    .menu-button {
      width: 42px;
      height: 34px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-button span {
      display: block;
      width: 42px;
      height: 4px;
      border-radius: 5px;
      background: #0b0b0b;
    }

    /* =========================
       MAIN
    ========================= */

    .login-page {
      width: 100%;
      max-width: 652px;
      margin: 0 auto;
      padding: 70px 0 100px;
    }

    /* Heading */

    .login-title {
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2.8px;
      margin-bottom: 25px;
    }

    .login-subtitle {
      font-size: 32px;
      line-height: 1.15;
      color: #555555;
      font-weight: 400;
      margin-bottom: 68px;
    }

    /* =========================
       GOOGLE BUTTON
    ========================= */

    .google-button {
      width: 100%;
      height: 80px;
      border: 2px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      display: flex;
      align-items: center;
      position: relative;
      cursor: pointer;
      color: #3f3f3f;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 30px;
      font-weight: 400;
    }

    .google-icon {
      position: absolute;
      left: 24px;
      width: 38px;
      height: 38px;
    }

    .google-text {
      width: 100%;
      text-align: center;
    }

    /* =========================
       DIVIDER
    ========================= */

    .email-divider {
      width: 100%;
      display: flex;
      align-items: center;
      margin: 55px 0 62px;
    }

    .email-divider::before,
    .email-divider::after {
      content: "";
      height: 2px;
      background: #dddddd;
      flex: 1;
    }

    .email-divider span {
      padding: 0 24px;
      color: #555555;
      font-size: 28px;
      line-height: 1;
      white-space: nowrap;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      width: 100%;
      margin-bottom: 43px;
    }

    .form-label {
      display: block;
      font-size: 29px;
      line-height: 1;
      font-weight: 700;
      margin-bottom: 25px;
    }

    .input-wrapper {
      width: 100%;
      height: 91px;
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 100%;
      border: 2px solid #dddddd;
      border-radius: 17px;
      background: #ffffff;
      outline: none;
      padding: 0 30px;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 29px;
      font-weight: 400;
    }

    .form-input::placeholder {
      color: #a8a8a8;
      opacity: 1;
    }

    .form-input:focus {
      border-color: #aaaaaa;
    }

    .password-input {
      padding-right: 85px;
    }

    /* Eye */

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 25px;
      transform: translateY(-50%);
      width: 40px;
      height: 30px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .eye {
      position: absolute;
      width: 34px;
      height: 22px;
      border: 4px solid #666666;
      border-radius: 70% 15%;
      transform: rotate(45deg);
      left: 2px;
      top: 3px;
    }

    .eye::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666666;
      left: 9px;
      top: 3px;
    }

    /* =========================
       REMEMBER / FORGOT
    ========================= */

    .account-options {
      width: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-top: -3px;
      margin-bottom: 58px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: pointer;
      color: #4f4f4f;
      font-size: 27px;
      line-height: 1.05;
      font-weight: 700;
    }

    .remember-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 31px;
      height: 31px;
      border: 3px solid #999999;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
    }

    .remember-checkbox:checked {
      background: #1677e8;
      border-color: #1677e8;
    }

    .remember-checkbox:checked::after {
      content: "";
      position: absolute;
      width: 8px;
      height: 15px;
      border-right: 3px solid #ffffff;
      border-bottom: 3px solid #ffffff;
      transform: rotate(45deg);
      left: 9px;
      top: 4px;
    }

    .forgot-link {
      color: #579f19;
      font-size: 27px;
      line-height: 1.05;
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* =========================
       FIREBASE MESSAGE
    ========================= */

    .firebase-message {
      display: none;
      width: 100%;
      min-height: 120px;
      border-radius: 17px;
      padding: 0 36px;
      align-items: center;
      margin-bottom: 42px;
      font-size: 29px;
      line-height: 1.25;
      font-weight: 500;
    }

    .firebase-message.error {
      display: flex;
      color: #9d2929;
      background: #fde1e1;
      border: 2px solid #ef7777;
    }

    .firebase-message.success {
      display: flex;
      color: #1f6d40;
      background: #d8f8e2;
      border: 2px solid #5bdb91;
    }

    /* =========================
       SIGN IN BUTTON
    ========================= */

    .signin-button {
      width: 100%;
      height: 96px;
      border: 0;
      border-radius: 17px;
      background: #55aa0d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 36px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .signin-button:hover {
      opacity: 0.94;
    }

    .signin-button:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* =========================
       SIGN UP
    ========================= */

    .signup-text {
      text-align: center;
      margin-top: 51px;
      color: #555555;
      font-size: 28px;
      line-height: 1.2;
      font-weight: 400;
    }

    .signup-link {
      color: #579f19;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 720px) {

      .site-header {
        height: 132px;
        padding: 0 38px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
        margin-right: 13px;
      }

      .brand-name {
        font-size: 30px;
      }

      .header-actions {
        gap: 40px;
      }

      .login-page {
        width: auto;
        max-width: none;
        margin: 0 64px;
        padding-top: 73px;
      }

      .login-title {
        font-size: 61px;
      }

      .login-subtitle {
        font-size: 31px;
      }
    }

    @media (max-width: 560px) {

      .site-header {
        height: 112px;
        padding: 0 24px;
      }

      .brand-logo {
        width: 34px;
        height: 34px;
        margin-right: 10px;
      }

      .brand-name {
        font-size: 25px;
        letter-spacing: -1px;
      }

      .header-actions {
        gap: 25px;
      }

      .menu-button {
        width: 34px;
        height: 29px;
      }

      .menu-button span {
        width: 34px;
        height: 3px;
      }

      .moon-icon {
        width: 29px;
        height: 29px;
        border-width: 3px;
      }

      .moon-icon::after {
        width: 25px;
        height: 25px;
      }

      .login-page {
        margin: 0 37px;
        padding-top: 67px;
        padding-bottom: 70px;
      }

      .login-title {
        font-size: 48px;
        letter-spacing: -2px;
        margin-bottom: 20px;
      }

      .login-subtitle {
        font-size: 25px;
        margin-bottom: 52px;
      }

      .google-button {
        height: 76px;
        font-size: 25px;
      }

      .google-icon {
        width: 34px;
        height: 34px;
        left: 20px;
      }

      .email-divider {
        margin: 50px 0 55px;
      }

      .email-divider span {
        font-size: 24px;
        padding: 0 16px;
      }

      .form-label {
        font-size: 25px;
        margin-bottom: 22px;
      }

      .input-wrapper {
        height: 88px;
      }

      .form-input {
        font-size: 24px;
        padding: 0 28px;
      }

      .account-options {
        margin-bottom: 48px;
      }

      .remember-label,
      .forgot-link {
        font-size: 22px;
      }

      .remember-checkbox {
        width: 31px;
        height: 31px;
      }

      .signin-button {
        height: 92px;
        font-size: 34px;
      }

      .signup-text {
        font-size: 24px;
        margin-top: 48px;
      }

      .firebase-message {
        min-height: 115px;
        font-size: 23px;
        padding: 0 27px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">
    <div class="header-inner">

      <a href="index.html" class="brand">

        <!-- VerifyStackAcct logo -->
        <svg
          class="brand-logo"
          viewBox="0 0 48 48"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <path
            d="M24 4L43 13.5L24 23L5 13.5L24 4Z"
            stroke="#58A817"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M5 22L24 31.5L43 22"
            stroke="#58A817"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <path
            d="M5 30.5L24 40L43 30.5"
            stroke="#58A817"
            stroke-width="3"
            stroke-linejoin="round"
          />
        </svg>

        <span class="brand-name">VerifyStackAcct</span>
      </a>

      <div class="header-actions">

        <button
          type="button"
          class="theme-button"
          id="themeButton"
          aria-label="Toggle dark mode"
        >
          <span class="moon-icon"></span>
        </button>

        <button
          type="button"
          class="menu-button"
          id="menuButton"
          aria-label="Open menu"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

      </div>
    </div>
  </header>


  <!-- =========================
       LOGIN
  ========================== -->

  <main class="login-page">

    <h1 class="login-title">Sign in</h1>

    <p class="login-subtitle">
      Welcome back to VerifyStackAcct
    </p>


    <!-- Google -->

    <button
      type="button"
      class="google-button"
      id="googleSignIn"
    >

      <!-- Real Google G SVG -->
      <svg
        class="google-icon"
        viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          fill="#FFC107"
          d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20c10 0 19.3-7.2 19.3-20 0-1.2-.1-2.3-.3-3.5Z"
        />
        <path
          fill="#FF3D00"
          d="M6.3 14.7l6.6 4.8C14.7 16 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7Z"
        />
        <path
          fill="#4CAF50"
          d="M24 44c5.3 0 10.1-2 13.7-5.3l-6.3-5.2C29.7 35 27 36 24 36c-5.2 0-9.7-3.6-11.3-8.5l-6.5 5C9.5 39.1 16.2 44 24 44Z"
        />
        <path
          fill="#1976D2"
          d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.4 5.5-6.1 6.8l6.3 5.2C39.2 36.8 44 31.1 44 24c0-1.2-.1-2.3-.4-3.5Z"
        />
      </svg>

      <span class="google-text">Sign in with Google</span>

    </button>


    <!-- Divider -->

    <div class="email-divider">
      <span>or sign in with email</span>
    </div>


    <!-- Firebase message -->

    <div
      id="firebaseMessage"
      class="firebase-message"
      role="alert"
    ></div>


    <!-- Email -->

    <div class="form-group">

      <label
        class="form-label"
        for="email"
      >
        Email
      </label>

      <div class="input-wrapper">

        <input
          id="email"
          class="form-input"
          type="email"
          autocomplete="email"
          placeholder="you@example.com"
        >

      </div>

    </div>


    <!-- Password -->

    <div class="form-group">

      <label
        class="form-label"
        for="password"
      >
        Password
      </label>

      <div class="input-wrapper">

        <input
          id="password"
          class="form-input password-input"
          type="password"
          autocomplete="current-password"
          placeholder="Enter your password"
        >

        <button
          type="button"
          class="password-toggle"
          id="passwordToggle"
          aria-label="Show password"
        >
          <span class="eye"></span>
        </button>

      </div>

    </div>


    <!-- Remember / Forgot -->

    <div class="account-options">

      <label class="remember-label">

        <input
          type="checkbox"
          class="remember-checkbox"
          id="rememberMe"
        >

        <span>Remember me</span>

      </label>

      <a
        href="forgot-password.html"
        class="forgot-link"
      >
        Forgot password?
      </a>

    </div>


    <!-- Sign in -->

    <button
      type="button"
      class="signin-button"
      id="signinButton"
    >
      Sign in
    </button>


    <!-- Sign up -->

    <p class="signup-text">
      Don't have an account?
      <a
        href="signup.html"
        class="signup-link"
      >
        Sign up
      </a>
    </p>

  </main>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAnalytics
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    /* Firebase configuration */

    const firebaseConfig = {
      apiKey: "AIzaSyAKAD0Gxtk4XxMmnR_kpjmy5VLoX72Dtls",
      authDomain: "connectsphere-7a679.firebaseapp.com",
      projectId: "connectsphere-7a679",
      storageBucket: "connectsphere-7a679.firebasestorage.app",
      messagingSenderId: "748741698521",
      appId: "1:748741698521:web:ea08d28f31a4d8638c2fc8",
      measurementId: "G-WRQ5GX3KMZ"
    };


    /* Initialize Firebase */

    const app = initializeApp(firebaseConfig);

    try {
      getAnalytics(app);
    } catch (error) {
      console.log("Analytics unavailable.");
    }

    const auth = getAuth(app);


    /* Elements */

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberMe =
      document.getElementById("rememberMe");

    const signinButton =
      document.getElementById("signinButton");

    const googleSignIn =
      document.getElementById("googleSignIn");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const firebaseMessage =
      document.getElementById("firebaseMessage");


    /* =========================
       FIREBASE MESSAGE
    ========================== */

    function showMessage(message, type) {

      firebaseMessage.textContent = message;

      firebaseMessage.className =
        "firebase-message " + type;

      firebaseMessage.scrollIntoView({
        behavior: "smooth",
        block: "center"
      });
    }


    function hideMessage() {

      firebaseMessage.textContent = "";

      firebaseMessage.className =
        "firebase-message";

    }


    /* =========================
       PASSWORD SHOW / HIDE
    ========================== */

    passwordToggle.addEventListener(
      "click",
      () => {

        const isPassword =
          passwordInput.type === "password";

        passwordInput.type =
          isPassword ? "text" : "password";

        passwordToggle.setAttribute(
          "aria-label",
          isPassword
            ? "Hide password"
            : "Show password"
        );

      }
    );


    /* =========================
       REMEMBER ME
    ========================== */

    const savedEmail =
      localStorage.getItem("rememberedEmail");

    if (savedEmail) {

      emailInput.value = savedEmail;

      rememberMe.checked = true;

    }


    /* =========================
       EMAIL SIGN IN
    ========================== */

    signinButton.addEventListener(
      "click",
      async () => {

        hideMessage();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password",
            "error"
          );

          return;

        }


        /* Button changes to Signing in... */

        signinButton.disabled = true;

        signinButton.textContent =
          "Signing in...";


        try {

          /* Firebase persistence */

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          /* Firebase login */

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          /* Remember email */

          if (rememberMe.checked) {

            localStorage.setItem(
              "rememberedEmail",
              email
            );

          } else {

            localStorage.removeItem(
              "rememberedEmail"
            );

          }


          /* Success message */

          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          /*
             Give the user time to see
             the green Firebase message.
          */

          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 1200);


        } catch (error) {

          console.error(error);


          let message =
            "Invalid email or password";


          if (
            error.code ===
            "auth/user-not-found"
          ) {

            message =
              "Invalid email or password";

          } else if (
            error.code ===
            "auth/wrong-password"
          ) {

            message =
              "Invalid email or password";

          } else if (
            error.code ===
            "auth/invalid-credential"
          ) {

            message =
              "Invalid email or password";

          } else if (
            error.code ===
            "auth/invalid-email"
          ) {

            message =
              "Please enter a valid email address";

          } else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            message =
              "Too many attempts. Please try again later.";

          } else if (
            error.code ===
            "auth/network-request-failed"
          ) {

            message =
              "Network error. Please check your connection.";

          }


          showMessage(
            message,
            "error"
          );


          /* Restore button */

          signinButton.disabled = false;

          signinButton.textContent =
            "Sign in";

        }

      }
    );


    /* =========================
       GOOGLE SIGN IN
    ========================== */

    googleSignIn.addEventListener(
      "click",
      async () => {

        hideMessage();

        googleSignIn.disabled = true;

        const originalText =
          googleSignIn.querySelector(
            ".google-text"
          ).textContent;

        googleSignIn.querySelector(
          ".google-text"
        ).textContent =
          "Signing in...";


        try {

          const provider =
            new GoogleAuthProvider();

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );

          await signInWithPopup(
            auth,
            provider
          );


          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          setTimeout(() => {

            window.location.href =
              "dashboard.html";

          }, 1200);


        } catch (error) {

          console.error(error);


          if (
            error.code !==
            "auth/popup-closed-by-user"
          ) {

            showMessage(
              "Unable to sign in with Google. Please try again.",
              "error"
            );

          }


          googleSignIn.disabled = false;

          googleSignIn.querySelector(
            ".google-text"
