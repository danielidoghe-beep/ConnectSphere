<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Connectsphere</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #111111;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      width: 100%;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #ffffff;
      border-bottom: 1px solid #ececec;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      color: #111111;
    }

    .logo {
      width: 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .logo span {
      display: block;
      width: 19px;
      height: 4px;
      background: #61ad16;
      border-radius: 10px;
      transform: skewY(-18deg);
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .theme-button {
      width: 28px;
      height: 28px;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .theme-button svg {
      width: 25px;
      height: 25px;
      fill: none;
      stroke: #555;
      stroke-width: 2;
    }

    .menu-button {
      width: 27px;
      border: 0;
      background: transparent;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      padding: 0;
    }

    .menu-button span {
      width: 27px;
      height: 2.5px;
      background: #111111;
      border-radius: 20px;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-wrapper {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 58px 24px 70px;
    }

    .login-title {
      font-size: 42px;
      line-height: 1;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 13px;
    }

    .login-subtitle {
      font-size: 16px;
      line-height: 1.5;
      color: #555555;
      margin-bottom: 35px;
    }

    /* =========================
       GOOGLE
    ========================= */

    .google-button {
      width: 100%;
      height: 52px;
      border: 1px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      color: #333333;
    }

    .google-button:hover {
      background: #fafafa;
    }

    .google-icon {
      position: absolute;
      left: 17px;
      width: 21px;
      height: 21px;
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 31px 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #dddddd;
    }

    .divider-text {
      font-size: 12px;
      color: #777777;
      white-space: nowrap;
    }

    /* =========================
       FIREBASE MESSAGE
    ========================= */

    .firebase-message {
      display: none;
      width: 100%;
      padding: 13px 15px;
      margin-bottom: 20px;
      border-radius: 9px;
      font-size: 13px;
      line-height: 1.4;
      font-weight: 600;
    }

    .firebase-message.error {
      display: block;
      background: #ffe2e2;
      border: 1px solid #f18b8b;
      color: #a52d2d;
    }

    .firebase-message.success {
      display: block;
      background: #def8e5;
      border: 1px solid #70cf8b;
      color: #267341;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 21px;
    }

    .form-label {
      display: block;
      margin-bottom: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #111111;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      height: 52px;
      border: 1px solid #dddddd;
      border-radius: 9px;
      background: #ffffff;
      outline: none;
      padding: 0 15px;
      font-family: inherit;
      font-size: 14px;
      color: #111111;
    }

    .form-input::placeholder {
      color: #a5a5a5;
    }

    .form-input:focus {
      border-color: #aeb4a8;
    }

    .password-input {
      padding-right: 52px;
    }

    /* =========================
       EYE
    ========================= */

    .password-toggle {
      position: absolute;
      right: 13px;
      top: 50%;
      transform: translateY(-50%);
      width: 30px;
      height: 30px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye-icon {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: #666666;
      stroke-width: 1.8;
    }

    /* =========================
       OPTIONS
    ========================= */

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 2px;
      margin-bottom: 27px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #555555;
      font-size: 12px;
      cursor: pointer;
    }

    .remember-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1px solid #999999;
      border-radius: 3px;
      background: #ffffff;
      cursor: pointer;
      position: relative;
    }

    .remember-checkbox:checked {
      background: #61ad16;
      border-color: #61ad16;
    }

    .remember-checkbox:checked::after {
      content: "";
      position: absolute;
      width: 4px;
      height: 8px;
      border-right: 2px solid #ffffff;
      border-bottom: 2px solid #ffffff;
      transform: rotate(45deg);
      left: 5px;
      top: 2px;
    }

    .forgot-link {
      color: #61a916;
      font-size: 12px;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================
       SIGN IN
    ========================= */

    .signin-button {
      width: 100%;
      height: 53px;
      border: 0;
      border-radius: 9px;
      background: #61ad16;
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }

    .signin-button:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    /* =========================
       SIGN UP
    ========================= */

    .signup-text {
      text-align: center;
      margin-top: 27px;
      font-size: 13px;
      color: #666666;
    }

    .signup-link {
      color: #61a916;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      .header {
        height: 64px;
        padding: 0 20px;
      }

      .brand-name {
        font-size: 17px;
      }

      .login-wrapper {
        max-width: 100%;
        padding: 52px 24px 65px;
      }

      .login-title {
        font-size: 40px;
      }

      .login-subtitle {
        font-size: 15px;
        margin-bottom: 32px;
      }

      .google-button {
        height: 51px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <a href="index.html" class="brand">

      <div class="logo">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <span class="brand-name">
       Connectsphere
      </span>

    </a>

    <div class="header-right">

      <button
        type="button"
        class="theme-button"
        id="themeButton"
        aria-label="Toggle theme"
      >
        <svg viewBox="0 0 24 24">
          <path d="M21 12.8A8.5 8.5 0 0 1 11.2 3a8.5 8.5 0 1 0 9.8 9.8Z"></path>
        </svg>
      </button>

      <button
        type="button"
        class="menu-button"
        id="menuButton"
        aria-label="Menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>

  </header>


  <!-- LOGIN -->

  <main class="login-wrapper">

    <h1 class="login-title">
      Sign in
    </h1>

    <p class="login-subtitle">
      Welcome back to Connectsphere
    </p>


    <!-- GOOGLE -->

    <button
      type="button"
      class="google-button"
      id="googleSignIn"
    >

      <!-- Real Google G icon -->
      <svg
        class="google-icon"
        viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6l6.85-6.85C35.9 2.65 30.47.5 24 .5 14.61.5 6.52 5.88 2.56 13.75l7.98 6.2C12.46 13.86 17.76 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.67c-.55 2.98-2.24 5.5-4.77 7.19l7.72 6c4.51-4.16 6.88-10.29 6.88-17.44z"
        />
        <path
          fill="#FBBC05"
          d="M10.54 28.55A14.48 14.48 0 0 1 9.75 24c0-1.58.28-3.12.79-4.55l-7.98-6.2A23.94 23.94 0 0 0 .5 24c0 3.86.92 7.52 2.56 10.75l7.48-6.2z"
        />
        <path
          fill="#34A853"
          d="M24 47.5c6.47 0 11.9-2.15 15.62-5.85l-7.72-6c-2.15 1.44-4.9 2.3-7.9 2.3-6.24 0-11.54-4.36-13.46-10.2l-7.98 6.2C6.52 42.12 14.61 47.5 24 47.5z"
        />
      </svg>

      <span id="googleText">
        Sign in with Google
      </span>

    </button>


    <!-- DIVIDER -->

    <div class="divider">

      <span class="divider-line"></span>

      <span class="divider-text">
        or sign in with email
      </span>

      <span class="divider-line"></span>

    </div>


    <!-- FIREBASE MESSAGE -->

    <div
      id="firebaseMessage"
      class="firebase-message"
      role="alert"
    ></div>


    <!-- FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label
          class="form-label"
          for="email"
        >
          Email
        </label>

        <input
          class="form-input"
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label
          class="form-label"
          for="password"
        >
          Password
        </label>

        <div class="input-wrapper">

          <input
            class="form-input password-input"
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
          >

            <svg
              class="eye-icon"
              id="eyeOpen"
              viewBox="0 0 24 24"
            >
              <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
              <circle cx="12" cy="12" r="2.8"></circle>
            </svg>

            <svg
              class="eye-icon"
              id="eyeClosed"
              viewBox="0 0 24 24"
              style="display:none;"
            >
              <path d="M3 3l18 18"></path>
              <path d="M10.6 6.3A10.7 10.7 0 0 1 12 6c6.5 0 10 6 10 6a17 17 0 0 1-4 4.3"></path>
              <path d="M6.2 7.7C3.4 9.6 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.7"></path>
            </svg>

          </button>

        </div>

      </div>


      <div class="form-options">

        <label class="remember-label">

          <input
            type="checkbox"
            id="rememberMe"
            class="remember-checkbox"
          >

          <span>Remember me</span>

        </label>

        <a
          href="forgot-password.html"
          class="forgot-link"
        >
          Forgot password?
        </a>

      </div>


      <button
        type="submit"
        class="signin-button"
        id="signinButton"
      >
        Sign in
      </button>

    </form>


    <p class="signup-text">
      Don't have an account?
      <a
        href="signup.html"
        class="signup-link"
      >
        Sign up
      </a>
    </p>

  </main>


  <!-- FIREBASE -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAKAD0Gxtk4XxMmnR_kpjmy5VLoX72Dtls",
      authDomain: "connectsphere-7a679.firebaseapp.com",
      projectId: "connectsphere-7a679",
      storageBucket: "connectsphere-7a679.firebasestorage.app",
      messagingSenderId: "748741698521",
      appId: "1:748741698521:web:ea08d28f31a4d8638c2fc8",
      measurementId: "G-WRQ5GX3KMZ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberMe =
      document.getElementById("rememberMe");

    const signinButton =
      document.getElementById("signinButton");

    const googleButton =
      document.getElementById("googleSignIn");

    const googleText =
      document.getElementById("googleText");

    const firebaseMessage =
      document.getElementById("firebaseMessage");


    /* =========================
       MESSAGE
    ========================= */

    function showMessage(text, type) {

      firebaseMessage.textContent = text;

      firebaseMessage.className =
        "firebase-message " + type;

    }


    function clearMessage() {

      firebaseMessage.textContent = "";

      firebaseMessage.className =
        "firebase-message";

    }


    /* =========================
       FIREBASE ERRORS
    ========================= */

    function firebaseError(error) {

      switch (error.code) {

        case "auth/invalid-credential":
        case "auth/invalid-login-credentials":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Invalid email or password.";

        case "auth/invalid-email":
          return "Please enter a valid email address.";

        case "auth/user-disabled":
          return "This account has been disabled.";

        case "auth/too-many-requests":
          return "Too many attempts. Please try again later.";

        case "auth/network-request-failed":
          return "Network error. Please check your connection.";

        case "auth/popup-closed-by-user":
          return "Google sign in was cancelled.";

        default:
          return "Unable to sign in. Please try again.";
      }
    }


    /* =========================
       PASSWORD SHOW/HIDE
    ========================= */

    const passwordToggle =
      document.getElementById("passwordToggle");

    const eyeOpen =
      document.getElementById("eyeOpen");

    const eyeClosed =
      document.getElementById("eyeClosed");


    passwordToggle.addEventListener(
      "click",
      () => {

        const hidden =
          passwordInput.type === "password";

        passwordInput.type =
          hidden ? "text" : "password";

        eyeOpen.style.display =
          hidden ? "none" : "block";

        eyeClosed.style.display =
          hidden ? "block" : "none";

      }
    );


    /* =========================
       EMAIL SIGN IN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();

        clearMessage();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          showMessage(
            "Please enter your email and password.",
            "error"
          );

          return;
        }


        signinButton.disabled = true;

        signinButton.textContent =
          "Signing in...";


        try {

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "You have logged in to your account successfully.",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "dashboard.html";

            },
            1200
          );


        } catch (error) {

          console.error(error);

          signinButton.disabled = false;

          signinButton.textContent =
            "Sign in";

          showMessage(
            firebaseError(error),
            "error"
          );

        }

      }
    );


    /* =========================
       GOOGLE SIGN IN
    ========================= */

    googleButton.addEventListener(
      "click",
      async () => {

        clearMessage();

        googleButton.disabled = true;

        googleText.textContent =
          "Signing in...";


        try {

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          const provider =
            new GoogleAuthProvider();


          await signInWithPopup(
            auth,
            provider
          );


          showMessage(
            "You have logged in to your account successfully.",
            "success"
          );


          setTimeout(
            () => {

              window.location.href =
                "dashboard.html";

            },
            1200
          );


        } catch (error) {

          console.error(error);

          googleButton.disabled = false;

          googleText.textContent =
            "Sign in with Google";

          showMessage(
            firebaseError(error),
            "error"
          );

        }

      }
    );


    /* =========================
       MENU
    ========================= */

    document
      .getElementById("menuButton")
      .addEventListener(
        "click",
        () => {

          window.location.href =
            "index.html";

        }
      );

  </script>

</body>
</html>
