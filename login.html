<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign in - Connectsphere</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      background: #ffffff;
      color: #111111;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       HEADER
    ========================= */

    .site-header {
      width: 100%;
      height: 132px;
      border-bottom: 1px solid #e5e5e5;
      display: flex;
      align-items: center;
      padding: 0 64px;
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      text-decoration: none;
      color: #111111;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
    }

    .brand-name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -1.5px;
      white-space: nowrap;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 110px;
    }

    /* Moon */

    .moon-button {
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .moon-icon {
      width: 38px;
      height: 38px;
      stroke: #606060;
      stroke-width: 2.8;
      fill: none;
    }

    /* Hamburger */

    .menu-button {
      width: 48px;
      height: 48px;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 8px;
      padding: 0;
    }

    .menu-line {
      width: 44px;
      height: 4px;
      background: #111111;
      border-radius: 5px;
      display: block;
    }

    /* =========================
       LOGIN AREA
    ========================= */

    .login-page {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      padding: 72px 0 80px;
    }

    .login-title {
      font-size: 64px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 22px;
    }

    .login-subtitle {
      font-size: 34px;
      line-height: 1.25;
      color: #595959;
      font-weight: 400;
      margin-bottom: 70px;
    }

    /* =========================
       GOOGLE BUTTON
    ========================= */

    .google-button {
      width: 100%;
      height: 78px;
      border: 2px solid #dddddd;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      position: relative;
      color: #3f3f3f;
      font-size: 30px;
      font-family: inherit;
      transition: background 0.15s ease;
    }

    .google-button:hover {
      background: #fafafa;
    }

    .google-icon {
      position: absolute;
      left: 25px;
      width: 38px;
      height: 38px;
    }

    .google-text {
      width: 100%;
      text-align: center;
    }

    /* =========================
       DIVIDER
    ========================= */

    .divider {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 24px;
      margin: 50px 0 62px;
    }

    .divider-line {
      height: 2px;
      background: #dddddd;
      flex: 1;
    }

    .divider-text {
      color: #555555;
      font-size: 30px;
      white-space: nowrap;
    }

    /* =========================
       FIREBASE MESSAGE
    ========================= */

    .firebase-message {
      display: none;
      width: 100%;
      min-height: 120px;
      border-radius: 16px;
      padding: 30px 36px;
      margin-bottom: 42px;
      font-size: 29px;
      line-height: 1.3;
      align-items: center;
    }

    .firebase-message.error {
      display: flex;
      background: #ffe1e1;
      border: 2px solid #f26b6b;
      color: #a52c2c;
    }

    .firebase-message.success {
      display: flex;
      background: #d9f9e2;
      border: 2px solid #55d38a;
      color: #226b40;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 42px;
    }

    .form-label {
      display: block;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 22px;
      color: #111111;
    }

    .input-wrapper {
      position: relative;
      width: 100%;
    }

    .form-input {
      width: 100%;
      height: 90px;
      border: 2px solid #dddddd;
      border-radius: 17px;
      background: #ffffff;
      outline: none;
      padding: 0 32px;
      font-family: inherit;
      font-size: 29px;
      color: #111111;
      transition: border-color 0.15s ease;
    }

    .form-input::placeholder {
      color: #aaaaaa;
      opacity: 1;
    }

    .form-input:focus {
      border-color: #bdbdbd;
    }

    .password-input {
      padding-right: 90px;
    }

    /* Eye */

    .password-toggle {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .eye-icon {
      width: 38px;
      height: 38px;
      stroke: #606060;
      stroke-width: 2.3;
      fill: none;
    }

    /* =========================
       REMEMBER / FORGOT
    ========================= */

    .form-options {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: -6px;
      margin-bottom: 46px;
    }

    .remember-label {
      display: flex;
      align-items: center;
      gap: 17px;
      cursor: pointer;
      color: #555555;
      font-size: 29px;
      font-weight: 700;
    }

    .remember-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 32px;
      height: 32px;
      border: 3px solid #929292;
      border-radius: 8px;
      background: #ffffff;
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
    }

    .remember-checkbox:checked {
      background: #287fe5;
      border-color: #287fe5;
    }

    .remember-checkbox:checked::after {
      content: "";
      position: absolute;
      left: 8px;
      top: 3px;
      width: 8px;
      height: 16px;
      border: solid #ffffff;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg);
    }

    .forgot-link {
      color: #589e1d;
      font-size: 29px;
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    /* =========================
       SIGN IN BUTTON
    ========================= */

    .signin-button {
      width: 100%;
      height: 96px;
      border: 0;
      border-radius: 16px;
      background: #56a915;
      color: #ffffff;
      font-family: inherit;
      font-size: 34px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s ease;
    }

    .signin-button:hover {
      opacity: 0.94;
    }

    .signin-button:disabled {
      cursor: not-allowed;
      opacity: 0.8;
    }

    /* =========================
       SIGN UP
    ========================= */

    .signup-text {
      text-align: center;
      margin-top: 50px;
      color: #595959;
      font-size: 29px;
      line-height: 1.35;
    }

    .signup-link {
      color: #589e1d;
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link:hover {
      text-decoration: underline;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .site-header {
        height: 132px;
        padding: 0 64px;
      }

      .brand-name {
        font-size: 32px;
      }

      .header-right {
        gap: 70px;
      }

      .login-page {
        max-width: none;
        margin: 0;
        padding: 72px 64px 80px;
      }
    }

    @media (max-width: 600px) {

      .site-header {
        height: 92px;
        padding: 0 24px;
      }

      .brand-logo {
        width: 40px;
        height: 40px;
      }

      .brand-name {
        font-size: 24px;
        letter-spacing: -1px;
      }

      .header-right {
        gap: 20px;
      }

      .moon-button {
        width: 38px;
        height: 38px;
      }

      .moon-icon {
        width: 32px;
        height: 32px;
      }

      .menu-button {
        width: 38px;
        height: 38px;
      }

      .menu-line {
        width: 36px;
        height: 4px;
      }

      .login-page {
        padding: 72px 32px 70px;
      }

      .login-title {
        font-size: 48px;
        letter-spacing: -2px;
        margin-bottom: 20px;
      }

      .login-subtitle {
        font-size: 28px;
        margin-bottom: 62px;
      }

      .google-button {
        height: 78px;
        font-size: 26px;
      }

      .google-icon {
        left: 24px;
        width: 38px;
        height: 38px;
      }

      .divider {
        margin: 48px 0 58px;
        gap: 18px;
      }

      .divider-text {
        font-size: 25px;
      }

      .form-label {
        font-size: 27px;
        margin-bottom: 20px;
      }

      .form-input {
        height: 90px;
        font-size: 25px;
        padding-left: 30px;
      }

      .form-group {
        margin-bottom: 40px;
      }

      .form-options {
        align-items: center;
        margin-bottom: 44px;
      }

      .remember-label,
      .forgot-link {
        font-size: 23px;
      }

      .remember-label {
        gap: 14px;
      }

      .remember-checkbox {
        width: 32px;
        height: 32px;
      }

      .signin-button {
        height: 96px;
        font-size: 32px;
      }

      .signup-text {
        font-size: 24px;
        margin-top: 48px;
      }

      .firebase-message {
        min-height: 120px;
        font-size: 23px;
        padding: 26px;
        margin-bottom: 38px;
      }
    }

    @media (max-width: 390px) {

      .site-header {
        padding: 0 18px;
      }

      .brand-name {
        font-size: 21px;
      }

      .brand-logo {
        width: 36px;
        height: 36px;
      }

      .header-right {
        gap: 12px;
      }

      .login-page {
        padding-left: 24px;
        padding-right: 24px;
      }

      .login-title {
        font-size: 44px;
      }

      .login-subtitle {
        font-size: 25px;
      }

      .google-button {
        font-size: 22px;
      }

      .divider-text {
        font-size: 22px;
      }

      .remember-label,
      .forgot-link {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================== -->

  <header class="site-header">

    <a href="index.html" class="brand">

      <!-- Connectsphere layered logo -->
      <svg
        class="brand-logo"
        viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          d="M24 4L43 14L24 24L5 14L24 4Z"
          fill="none"
          stroke="#56A915"
          stroke-width="3"
          stroke-linejoin="round"
        />

        <path
          d="M5 23L24 33L43 23"
          fill="none"
          stroke="#56A915"
          stroke-width="3"
          stroke-linejoin="round"
        />

        <path
          d="M5 32L24 42L43 32"
          fill="none"
          stroke="#56A915"
          stroke-width="3"
          stroke-linejoin="round"
        />
      </svg>

      <span class="brand-name">Connectsphere</span>

    </a>

    <div class="header-right">

      <button
        type="button"
        class="moon-button"
        id="themeToggle"
        aria-label="Toggle dark mode"
      >
        <svg
          class="moon-icon"
          viewBox="0 0 40 40"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M30.5 25.5C27.9 28.3 24.2 30 20.1 30C12.1 30 5.6 23.5 5.6 15.5C5.6 11.4 7.3 7.7 10.1 5.1C9.8 6.2 9.6 7.4 9.6 8.7C9.6 16.7 16.1 23.2 24.1 23.2C26.4 23.2 28.6 22.6 30.5 21.6C30.5 22.9 30.5 24.2 30.5 25.5Z"
          />
        </svg>
      </button>

      <button
        type="button"
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        <span class="menu-line"></span>
        <span class="menu-line"></span>
        <span class="menu-line"></span>
      </button>

    </div>

  </header>


  <!-- =========================
       LOGIN
  ========================== -->

  <main class="login-page">

    <h1 class="login-title">Sign in</h1>

    <p class="login-subtitle">
      Welcome back to Connecsphere
    </p>


    <!-- Google -->

    <button
      type="button"
      class="google-button"
      id="googleSignIn"
    >

      <!-- Google G icon -->
      <svg
        class="google-icon"
        viewBox="0 0 48 48"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <path
          fill="#EA4335"
          d="M24 9.5c3.54 0 6.72 1.22 9.22 3.6l6.85-6.85C35.9 2.65 30.47.5 24 .5 14.61.5 6.52 5.88 2.56 13.75l7.98 6.2C12.46 13.86 17.76 9.5 24 9.5z"
        />
        <path
          fill="#4285F4"
          d="M46.5 24.5c0-1.64-.15-3.22-.42-4.75H24v9h12.67c-.55 2.98-2.24 5.5-4.77 7.19l7.72 6c4.51-4.16 6.88-10.29 6.88-17.44z"
        />
        <path
          fill="#FBBC05"
          d="M10.54 28.55A14.48 14.48 0 0 1 9.75 24c0-1.58.28-3.12.79-4.55l-7.98-6.2A23.94 23.94 0 0 0 .5 24c0 3.86.92 7.52 2.56 10.75l7.48-6.2z"
        />
        <path
          fill="#34A853"
          d="M24 47.5c6.47 0 11.9-2.15 15.62-5.85l-7.72-6c-2.15 1.44-4.9 2.3-7.9 2.3-6.24 0-11.54-4.36-13.46-10.2l-7.98 6.2C6.52 42.12 14.61 47.5 24 47.5z"
        />
      </svg>

      <span class="google-text">
        Sign in with Google
      </span>

    </button>


    <!-- Divider -->

    <div class="divider">

      <span class="divider-line"></span>

      <span class="divider-text">
        or sign in with email
      </span>

      <span class="divider-line"></span>

    </div>


    <!-- Firebase message -->

    <div
      id="firebaseMessage"
      class="firebase-message"
      role="alert"
    ></div>


    <!-- Email -->

    <form id="loginForm">

      <div class="form-group">

        <label
          for="email"
          class="form-label"
        >
          Email
        </label>

        <input
          type="email"
          id="email"
          class="form-input"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

      </div>


      <!-- Password -->

      <div class="form-group">

        <label
          for="password"
          class="form-label"
        >
          Password
        </label>

        <div class="input-wrapper">

          <input
            type="password"
            id="password"
            class="form-input password-input"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          >

          <button
            type="button"
            class="password-toggle"
            id="passwordToggle"
            aria-label="Show password"
          >

            <svg
              class="eye-icon"
              id="eyeOpen"
              viewBox="0 0 40 40"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M3.5 20S9.5 10 20 10s16.5 10 16.5 10S30.5 30 20 30S3.5 20 3.5 20Z"
              />
              <circle
                cx="20"
                cy="20"
                r="5"
              />
            </svg>

            <svg
              class="eye-icon"
              id="eyeClosed"
              viewBox="0 0 40 40"
              xmlns="http://www.w3.org/2000/svg"
              style="display:none;"
            >
              <path
                d="M4 4L36 36"
              />
              <path
                d="M16.5 12.5C17.6 12.2 18.8 12 20 12C30.5 12 36.5 20 36.5 20C36.5 20 34.2 23.1 30.6 25.5"
              />
              <path
                d="M12.3 15.3C7.8 17.5 3.5 20 3.5 20C3.5 20 9.5 30 20 30C22.3 30 24.4 29.5 26.3 28.7"
              />
              <path
                d="M16.5 16.5C14.6 18.4 14.6 21.6 16.5 23.5C18.4 25.4 21.6 25.4 23.5 23.5C25.4 21.6 25.4 18.4 23.5 16.5"
              />
            </svg>

          </button>

        </div>

      </div>


      <!-- Remember / Forgot -->

      <div class="form-options">

        <label class="remember-label">

          <input
            type="checkbox"
            id="rememberMe"
            class="remember-checkbox"
          >

          <span>Remember me</span>

        </label>

        <a
          href="forgot-password.html"
          class="forgot-link"
        >
          Forgot password?
        </a>

      </div>


      <!-- Sign in -->

      <button
        type="submit"
        class="signin-button"
        id="signinButton"
      >
        Sign in
      </button>

    </form>


    <!-- Sign up -->

    <p class="signup-text">
      Don't have an account?
      <a
        href="signup.html"
        class="signup-link"
      >
        Sign up
      </a>
    </p>

  </main>


  <!-- =========================
       FIREBASE
  ========================== -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup,
      setPersistence,
      browserLocalPersistence,
      browserSessionPersistence
    } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAKAD0Gxtk4XxMmnR_kpjmy5VLoX72Dtls",
      authDomain: "connectsphere-7a679.firebaseapp.com",
      projectId: "connectsphere-7a679",
      storageBucket: "connectsphere-7a679.firebasestorage.app",
      messagingSenderId: "748741698521",
      appId: "1:748741698521:web:ea08d28f31a4d8638c2fc8",
      measurementId: "G-WRQ5GX3KMZ"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const rememberMe =
      document.getElementById("rememberMe");

    const signinButton =
      document.getElementById("signinButton");

    const googleSignIn =
      document.getElementById("googleSignIn");

    const firebaseMessage =
      document.getElementById("firebaseMessage");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const eyeOpen =
      document.getElementById("eyeOpen");

    const eyeClosed =
      document.getElementById("eyeClosed");


    /* =========================
       FIREBASE MESSAGE
    ========================= */

    function showMessage(message, type) {

      firebaseMessage.textContent = message;

      firebaseMessage.className =
        "firebase-message " + type;

    }


    function hideMessage() {

      firebaseMessage.textContent = "";

      firebaseMessage.className =
        "firebase-message";

    }


    /* =========================
       FIREBASE ERROR TEXT
    ========================= */

    function getFirebaseErrorMessage(error) {

      switch (error.code) {

        case "auth/invalid-credential":
        case "auth/invalid-login-credentials":
        case "auth/wrong-password":
        case "auth/user-not-found":
          return "Invalid email or password";

        case "auth/invalid-email":
          return "Invalid email address";

        case "auth/user-disabled":
          return "This account has been disabled";

        case "auth/too-many-requests":
          return "Too many unsuccessful attempts. Please try again later.";

        case "auth/network-request-failed":
          return "Network error. Please check your internet connection.";

        case "auth/popup-closed-by-user":
          return "Google sign-in was cancelled";

        case "auth/popup-blocked":
          return "Google sign-in was blocked by your browser";

        default:
          return "Unable to sign in. Please try again.";
      }

    }


    /* =========================
       PASSWORD VISIBILITY
    ========================= */

    passwordToggle.addEventListener(
      "click",
      function () {

        if (passwordInput.type === "password") {

          passwordInput.type = "text";

          eyeOpen.style.display = "none";
          eyeClosed.style.display = "block";

          passwordToggle.setAttribute(
            "aria-label",
            "Hide password"
          );

        } else {

          passwordInput.type = "password";

          eyeOpen.style.display = "block";
          eyeClosed.style.display = "none";

          passwordToggle.setAttribute(
            "aria-label",
            "Show password"
          );

        }

      }
    );


    /* =========================
       EMAIL SIGN IN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        hideMessage();

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {
          showMessage(
            "Please enter your email and password",
            "error"
          );
          return;
        }


        /*
          Button changes immediately to:
          Signing in
        */

        signinButton.disabled = true;

        signinButton.textContent =
          "Signing in";


        try {

          /*
            Remember me controls Firebase
            persistence.
          */

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          if (userCredential.user) {

            /*
              EXACT success message style
              from the design you provided.
            */

            showMessage(
              "Login successful! Redirecting...",
              "success"
            );


            /*
              Give the user time to see
              the success message.
            */

            setTimeout(
              function () {

                window.location.href =
                  "dashboard.html";

              },
              1200
            );

          }

        } catch (error) {

          console.error(
            "Firebase sign-in error:",
            error
          );


          /*
            Restore button after failure.
          */

          signinButton.disabled = false;

          signinButton.textContent =
            "Sign in";


          showMessage(
            getFirebaseErrorMessage(error),
            "error"
          );

        }

      }
    );


    /* =========================
       GOOGLE SIGN IN
    ========================= */

    googleSignIn.addEventListener(
      "click",
      async function () {

        hideMessage();

        googleSignIn.disabled = true;

        const originalText =
          googleSignIn.querySelector(
            ".google-text"
          ).textContent;

        googleSignIn.querySelector(
          ".google-text"
        ).textContent =
          "Signing in";


        try {

          await setPersistence(
            auth,
            rememberMe.checked
              ? browserLocalPersistence
              : browserSessionPersistence
          );


          const provider =
            new GoogleAuthProvider();


          const result =
            await signInWithPopup(
              auth,
              provider
            );


          if (result.user) {

            showMessage(
              "Login successful! Redirecting...",
              "success"
            );


            setTimeout(
              function () {

                window.location.href =
                  "dashboard.html";

              },
              1200
            );

          }

        } catch (error) {

          console.error(
            "Google sign-in error:",
            error
          );


          googleSignIn.disabled = false;

          googleSignIn.querySelector(
            ".google-text"
          ).textContent =
            originalText;


          showMessage(
            getFirebaseErrorMessage(error),
            "error"
          );

        }

      }
    );


    /* =========================
       DARK MODE BUTTON
    ========================= */

    const themeToggle =
      document.getElementById("themeToggle");

    themeToggle.addEventListener(
      "click",
      function () {

        document.body.classList.toggle(
          "dark-mode"
        );

      }
    );


    /* =========================
       MENU BUTTON
    ========================= */

    const menuButton =
      document.getElementById("menuButton");

    menuButton.addEventListener(
      "click",
      function () {

        /*
          Connect this to your existing
          slide menu if your homepage already
          has one.
        */

        window.location.href =
          "index.html";

      }
    );

  </script>

</body>
</html>
