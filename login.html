<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - VerifyStackAcct</title>

    <!-- Login page CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <a href="index.html" class="brand">
            <span class="brand-logo" aria-hidden="true">
                <svg viewBox="0 0 52 52" xmlns="http://www.w3.org/2000/svg">
                    <path d="M26 4L5 15.5L26 27L47 15.5L26 4Z"
                          fill="none"
                          stroke="#57A617"
                          stroke-width="3.5"
                          stroke-linejoin="round"/>

                    <path d="M5 25L26 36.5L47 25"
                          fill="none"
                          stroke="#57A617"
                          stroke-width="3.5"
                          stroke-linejoin="round"/>

                    <path d="M5 34.5L26 46L47 34.5"
                          fill="none"
                          stroke="#57A617"
                          stroke-width="3.5"
                          stroke-linejoin="round"/>
                </svg>
            </span>

            <span class="brand-name">VerifyStackAcct</span>
        </a>


        <div class="header-actions">

            <!-- Dark mode button -->
            <button
                type="button"
                class="theme-toggle"
                id="themeToggle"
                aria-label="Toggle dark mode">

                <svg
                    class="moon-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <path
                        d="M20.5 15.5C19.2 16.1 17.8 16.4 16.3 16.3C11.8 16 8 12.2 7.7 7.7C7.6 6.2 7.9 4.8 8.5 3.5C4.5 5 2 8.8 2.4 13.1C2.9 18 7 21.7 11.9 21.7C16.2 21.7 19.9 19.2 21.4 15.2C21.1 15.3 20.8 15.4 20.5 15.5Z"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                </svg>
            </button>


            <!-- Mobile menu -->
            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="Open menu">

                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </header>


    <!-- =========================
         LOGIN PAGE
    ========================== -->
    <main class="login-page">

        <section class="login-container">

            <!-- Heading -->
            <div class="login-heading">
                <h1>Sign in</h1>

                <p>
                    Welcome back to VerifyStackAcct
                </p>
            </div>


            <!-- =========================
                 GOOGLE SIGN IN
            ========================== -->
            <button
                type="button"
                class="google-signin"
                id="googleSignInBtn">

                <!-- Official Google G logo -->
                <svg
                    class="google-icon"
                    width="32"
                    height="32"
                    viewBox="0 0 48 48"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">

                    <path
                        fill="#FFC107"
                        d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5Z"/>

                    <path
                        fill="#FF3D00"
                        d="M6.3 14.7l6.6 4.8C14.7 16 18.9 12 24 12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4c-7.7 0-14.3 4.3-17.7 10.7Z"/>

                    <path
                        fill="#4CAF50"
                        d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.6 35.1 27 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.5 16.2 44 24 44Z"/>

                    <path
                        fill="#1976D2"
                        d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.7 5.5-7.1 6.8l6.2 5.2C38.1 36.8 44 31.2 44 24c0-1.2-.1-2.4-.4-3.5Z"/>
                </svg>

                <span>Sign in with Google</span>
            </button>


            <!-- =========================
                 EMAIL DIVIDER
            ========================== -->
            <div class="login-divider">

                <span class="divider-line"></span>

                <span class="divider-text">
                    or sign in with email
                </span>

                <span class="divider-line"></span>

            </div>


            <!-- =========================
                 FIREBASE MESSAGE
                 Hidden until needed
            ========================== -->
            <div
                id="firebaseMessage"
                class="firebase-message"
                role="alert"
                aria-live="polite"
                hidden>

                <span id="firebaseMessageText"></span>

            </div>


            <!-- =========================
                 EMAIL/PASSWORD FORM
            ========================== -->
            <form id="loginForm" class="login-form">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required>

                        <!-- Password visibility -->
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password">

                            <!-- Eye icon -->
                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true">

                                <path
                                    d="M2.5 12C2.5 12 6 5.5 12 5.5C18 5.5 21.5 12 21.5 12C21.5 12 18 18.5 12 18.5C6 18.5 2.5 12 2.5 12Z"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"/>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="2"/>
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="login-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe">

                        <span class="custom-checkbox"></span>

                        <span class="remember-text">
                            Remember me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-password">

                        Forgot password?

                    </a>

                </div>


                <!-- =========================
                     SIGN IN BUTTON
                ========================== -->
                <button
                    type="submit"
                    class="signin-button"
                    id="signinButton">

                    <span id="signinButtonText">
                        Sign in
                    </span>

                    <span
                        id="signinLoader"
                        class="signin-loader"
                        hidden>
                    </span>

                </button>

            </form>


            <!-- =========================
                 SIGN UP
            ========================== -->
            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </section>

    </main>


    <!-- Firebase / login functionality will be added in the next part -->
    <script type="module" src="login.js"></script>

</body>
</html>
