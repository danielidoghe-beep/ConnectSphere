<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Sign In - Connectphere</title>

    <!-- CSS will be added next -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="site-header">

        <div class="header-inner">

            <!-- Logo -->
            <a href="index.html" class="brand" aria-label="VerifyStackAcct Home">

                <svg
                    class="brand-icon"
                    viewBox="0 0 48 48"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        d="M24 4L4 14L24 24L44 14L24 4Z"
                        fill="none"
                        stroke="#59A817"
                        stroke-width="3"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M4 23L24 33L44 23"
                        fill="none"
                        stroke="#59A817"
                        stroke-width="3"
                        stroke-linejoin="round"
                    />

                    <path
                        d="M4 32L24 42L44 32"
                        fill="none"
                        stroke="#59A817"
                        stroke-width="3"
                        stroke-linejoin="round"
                    />
                </svg>

                <span class="brand-name">VerifyStackAcct</span>

            </a>


            <!-- Header controls -->
            <div class="header-controls">

                <!-- Dark mode button -->
                <button
                    type="button"
                    class="theme-toggle"
                    id="themeToggle"
                    aria-label="Toggle dark mode"
                >
                    <svg
                        class="moon-icon"
                        viewBox="0 0 32 32"
                        xmlns="http://www.w3.org/2000/svg"
                        aria-hidden="true"
                    >
                        <path
                            d="M26.5 20.7C24.9 21.4 23.2 21.8 21.3 21.8C14.8 21.8 9.5 16.5 9.5 10C9.5 8.1 9.9 6.4 10.6 4.8C5.8 6.8 2.5 11.4 2.5 16.8C2.5 23.9 8.3 29.5 15.4 29.5C20.8 29.5 25.4 26.2 27.4 21.4C27.1 21.2 26.8 21 26.5 20.7Z"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        />
                    </svg>
                </button>


                <!-- Mobile menu -->
                <button
                    type="button"
                    class="menu-toggle"
                    id="menuToggle"
                    aria-label="Open menu"
                    aria-expanded="false"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

            </div>

        </div>

    </header>


    <!-- =========================
         MOBILE MENU
    ========================== -->
    <nav
        class="mobile-menu"
        id="mobileMenu"
        aria-hidden="true"
    >

        <a href="index.html">Home</a>
        <a href="pricing.html">Pricing</a>
        <a href="signin.html">Sign in</a>
        <a href="signup.html">Get started</a>
        <a href="faq.html">FAQ</a>

    </nav>


    <!-- =========================
         MAIN SIGN-IN CONTENT
    ========================== -->
    <main class="signin-page">

        <section class="signin-container">

            <!-- Heading -->
            <div class="signin-heading">

                <h1>Sign in</h1>

                <p>Welcome back to VerifyStackAcct</p>

            </div>


            <!-- =========================
                 GOOGLE SIGN IN
            ========================== -->
            <button
                type="button"
                class="google-signin-button"
                id="googleSignInButton"
            >

                <!-- Real Google G logo -->
                <svg
                    class="google-icon"
                    viewBox="0 0 48 48"
                    xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true"
                >
                    <path
                        fill="#EA4335"
                        d="M24 9.5c3.54 0 6.72 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.61 0 6.52 5.38 2.56 13.22l7.98 6.19C12.43 13.21 17.74 9.5 24 9.5z"
                    />

                    <path
                        fill="#4285F4"
                        d="M46.98 24.55c0-1.64-.15-3.22-.42-4.74H24v9h12.94c-.56 3-2.26 5.54-4.82 7.24l7.73 6c4.51-4.17 7.13-10.32 7.13-17.5z"
                    />

                    <path
                        fill="#FBBC05"
                        d="M10.54 28.59A14.43 14.43 0 0 1 9.5 24c0-1.59.36-3.13 1.04-4.59l-7.98-6.19A23.94 23.94 0 0 0 0 24c0 3.87.93 7.54 2.56 10.78l7.98-6.19z"
                    />

                    <path
                        fill="#34A853"
                        d="M24 48c6.48 0 11.91-2.14 15.85-5.85l-7.73-6c-2.14 1.44-4.86 2.29-8.12 2.29-6.26 0-11.57-3.71-13.46-8.91l-7.98 6.19C6.52 42.62 14.61 48 24 48z"
                    />
                </svg>

                <span>Sign in with Google</span>

            </button>


            <!-- =========================
                 DIVIDER
            ========================== -->
            <div class="signin-divider">

                <span class="divider-line"></span>

                <span class="divider-text">
                    or sign in with email
                </span>

                <span class="divider-line"></span>

            </div>


            <!-- =========================
                 FIREBASE MESSAGE AREA
            ========================== -->

            <!-- Error message -->
            <div
                class="firebase-message firebase-error"
                id="firebaseError"
                role="alert"
                aria-live="polite"
                hidden
            >
                Invalid email or password
            </div>


            <!-- Success message -->
            <div
                class="firebase-message firebase-success"
                id="firebaseSuccess"
                role="status"
                aria-live="polite"
                hidden
            >
                Login successful! Redirecting...
            </div>


            <!-- =========================
                 EMAIL/PASSWORD FORM
            ========================== -->
            <form
                class="signin-form"
                id="signinForm"
                novalidate
            >

                <!-- Email -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            autocomplete="current-password"
                            placeholder="Enter your password"
                            required
                        >

                        <!-- Password visibility -->
                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >

                            <!-- Eye icon -->
                            <svg
                                class="eye-icon eye-visible"
                                viewBox="0 0 32 32"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >
                                <path
                                    d="M2.5 16C5.8 9.7 10.5 6.5 16 6.5S26.2 9.7 29.5 16C26.2 22.3 21.5 25.5 16 25.5S5.8 22.3 2.5 16Z"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.3"
                                    stroke-linejoin="round"
                                />

                                <circle
                                    cx="16"
                                    cy="16"
                                    r="4"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.3"
                                />
                            </svg>


                            <!-- Hidden eye-off icon -->
                            <svg
                                class="eye-icon eye-hidden"
                                viewBox="0 0 32 32"
                                xmlns="http://www.w3.org/2000/svg"
                                aria-hidden="true"
                            >
                                <path
                                    d="M4 4L28 28"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.5"
                                    stroke-linecap="round"
                                />

                                <path
                                    d="M13.7 7C14.45 6.68 15.22 6.5 16 6.5C21.5 6.5 26.2 9.7 29.5 16C28.15 18.58 26.55 20.6 24.7 22.08"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.3"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />

                                <path
                                    d="M9.3 9.92C6.72 11.32 4.45 13.35 2.5 16C5.8 22.3 10.5 25.5 16 25.5C17.9 25.5 19.67 25.15 21.3 24.47"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2.3"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                />
                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Remember / Forgot -->
                <div class="form-options">

                    <label class="remember-option">

                        <input
                            type="checkbox"
                            id="rememberMe"
                            name="rememberMe"
                        >

                        <span class="custom-checkbox"></span>

                        <span class="remember-text">
                            Remember me
                        </span>

                    </label>


                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot password?
                    </a>

                </div>


                <!-- =========================
                     SIGN IN BUTTON
                ========================== -->
                <button
                    type="submit"
                    class="signin-button"
                    id="signinButton"
                >

                    <span
                        class="signin-button-text"
                        id="signinButtonText"
                    >
                        Sign in
                    </span>

                    <span
                        class="signin-loading-text"
                        id="signinLoadingText"
                        hidden
                    >
                        Signing in...
                    </span>

                </button>

            </form>


            <!-- =========================
                 SIGN UP
            ========================== -->
            <p class="signup-prompt">

                <span>Don't have an account?</span>

                <a href="signup.html">
                    Sign up
                </a>

            </p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT WILL BE ADDED
         AFTER THE CSS
    ========================== -->
    <script type="module" src="login.js"></script>

</body>
</html>
